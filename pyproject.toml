[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-pulse"
version = "0.1.0"
description = "Customer-experience observability for a data platform: dashboard, Slack bot, and LLM triage agent over MCP tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38",
    "plotly>=5.22",
    "pandas>=2.2",
    "slack-bolt>=1.20",
    "mcp>=1.2,<2",
    "anthropic>=0.40",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
